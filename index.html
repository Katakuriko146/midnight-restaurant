<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>深夜食堂｜LAST ORDER</title><style>*{box-sizing:border-box}body{margin:0;background:#10100f;color:#e8dfcc;font-family:system-ui,'Noto Sans JP',sans-serif}main{max-width:560px;margin:auto;padding:18px}h1{font-family:serif;letter-spacing:.15em;text-align:center;font-size:29px;margin:12px 0 4px}.sub{text-align:center;color:#a39883;font-size:11px;letter-spacing:.2em}.status{display:flex;justify-content:space-between;border-bottom:1px solid #5b4c3d;padding:12px 0;font-size:13px}.scene{height:255px;position:relative;margin:18px 0 12px;background:linear-gradient(#34342e 0 42%,#27231f 42% 68%,#49382d 68%);border:7px solid #211d19;overflow:hidden;transition:filter .5s}.window{position:absolute;left:10%;top:12%;width:28%;height:38%;background:#0a1117;border:7px solid #55483c;box-shadow:inset 0 0 18px #101c2c}.window:after{content:'';position:absolute;left:50%;height:100%;border-left:5px solid #55483c}.clock{position:absolute;right:12%;top:12%;font-size:20px;color:#b8a18a}.counter{position:absolute;bottom:0;width:100%;height:35%;background:linear-gradient(#75533b,#35271e);border-top:8px solid #aa7950}.plate{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);font-size:66px;filter:drop-shadow(0 5px 4px #17100c)}.shadow{position:absolute;right:15%;top:22%;font-size:70px;opacity:0;transition:opacity 1s}.scene.haunt .shadow{opacity:.75}.scene.dread{filter:saturate(.55) brightness(.65)}.scene.terror{filter:saturate(.35) brightness(.42)}.scene.terror .shadow{opacity:1;color:#7e1717}.dialog{min-height:90px;background:#211e1a;border:1px solid #574739;padding:15px;line-height:1.7;font-size:15px}.who{font-size:11px;color:#c7a36c;margin-bottom:5px}.order{margin:16px 0;padding:12px;background:#2b2721;border-left:3px solid #a47748}.order b{color:#f0c889}.ingredients{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.ingredients button,.action{background:#3a332b;border:1px solid #80694e;color:#f5e5c9;padding:15px 8px;font-size:15px;border-radius:6px;cursor:pointer}.ingredients button.selected{background:#79603c;border-color:#edc78b}.ingredients button:disabled{opacity:.35}.action{display:block;width:100%;margin-top:12px;background:#91683d;color:#fff3db;font-weight:700}.action:disabled{opacity:.35}#msg{min-height:28px;text-align:center;color:#d8b98c;font-size:13px;margin-top:12px}.foot{text-align:center;color:#71685d;font-size:11px;margin-top:20px}.red{color:#d86962}.end{font-size:18px;text-align:center;line-height:1.8;padding:24px 8px}.hidden{display:none}@keyframes flicker{0%,90%,100%{opacity:1}92%,96%{opacity:.25}}.terror{animation:flicker 2.8s infinite}@media(prefers-reduced-motion:reduce){.terror{animation:none}}</style></head><body><main><h1>深夜食堂</h1><div class="sub">LAST ORDER — 00:00</div><div class="status"><span id="shift">営業前</span><span id="time">23:50</span><span id="sanity">店内：正常</span></div><div class="scene" id="scene"><div class="window"></div><div class="clock" id="wallclock">◷ 23:50</div><div class="shadow" id="shadow">♟</div><div class="counter"></div><div class="plate" id="plate">🍽️</div></div><div class="dialog"><div class="who" id="who">店主のメモ</div><div id="dialog">いらっしゃいませ。深夜の小さなレストランへようこそ。注文を聞いて、材料を選び、料理を出してください。</div></div><div id="game" class="hidden"><div class="order">注文：<b id="order"></b><div style="font-size:12px;margin-top:6px;color:#a89b86" id="hint">材料を2つ選んでください。</div></div><div class="ingredients" id="ingredients"></div><button class="action" id="cook" disabled>料理を出す</button><div id="msg"></div></div><button class="action" id="start">開店する</button><div id="ending" class="hidden end"></div><div class="foot">音なしで遊べます · 約3分 · スマートフォン対応</div></main><script>
const dishes=[{name:'トマトスープ',needs:['🍅 トマト','💧 水'],say:'温かいですね。……外は、こんなに寒いのに。'},{name:'オムレツ',needs:['🥚 卵','🧈 バター'],say:'この店、昨日も開いていましたか？'},{name:'きのこのソテー',needs:['🍄 きのこ','🧈 バター'],say:'窓の外に立っている人、知り合いですか？'},{name:'赤いスープ',needs:['🍅 トマト','💧 水'],say:'……どうして、私が頼む前から作っていたんですか。'},{name:'最後の一皿',needs:['🥚 卵','🍄 きのこ'],say:'あなたの席が、ずっと空いています。'}];const all=['🍅 トマト','💧 水','🥚 卵','🧈 バター','🍄 きのこ','🧂 塩'];let stage=0,selected=[],locked=false;const $=id=>document.getElementById(id);function talk(w,t){$('who').textContent=w;$('dialog').textContent=t}function begin(){stage=0;$('start').classList.add('hidden');$('ending').classList.add('hidden');$('game').classList.remove('hidden');next()}function next(){if(stage>=5)return finish();selected=[];locked=false;const d=dishes[stage];$('shift').textContent=`注文 ${stage+1} / 5`;$('time').textContent=['23:55','00:00','00:13','00:??','--:--'][stage];$('wallclock').textContent='◷ '+$('time').textContent;$('sanity').textContent=['店内：正常','店内：正常','店内：違和感','店内：異常','店内：不明'][stage];$('sanity').className=stage>2?'red':'';$('scene').className='scene'+(stage>=4?' terror':stage>=3?' dread haunt':stage>=2?' haunt':'');$('plate').textContent=stage<2?'🍽️':stage<4?'🥣':'🍽️';$('order').textContent=d.name;$('hint').textContent='材料を2つ選んでください。';$('msg').textContent='';$('cook').disabled=true;talk(['お客様','お客様','お客様','厨房の奥','？？？'][stage],['トマトスープをお願いします。','オムレツをください。……まだ誰も来ていませんよね。','きのこのソテーを。窓は見ないほうがいい。','注文票が勝手に印刷された。「赤いスープ」','客席には誰もいない。なのに注文が届いた。'][stage]);render()}function render(){$('ingredients').innerHTML='';all.forEach(x=>{let b=document.createElement('button');b.textContent=x;b.className=selected.includes(x)?'selected':'';b.onclick=()=>{if(locked)return;selected=selected.includes(x)?selected.filter(a=>a!==x):selected.length<2?[...selected,x]:selected;$('cook').disabled=selected.length!==2;render()};$('ingredients').appendChild(b)})}function cook(){if(locked)return;const d=dishes[stage];if(!d.needs.every(x=>selected.includes(x))){$('msg').textContent=stage>=3?'材料が違う。背後で誰かが笑った。':'材料が違います。注文を確認してください。';return}locked=true;$('cook').disabled=true;$('plate').textContent=['🥣','🍳','🍄','🥣','🍽️'][stage];talk(stage>=3?'？？？':'お客様',d.say);$('msg').textContent=stage===4?'……食器が、ひとりでに動いた。':'料理を提供しました。';$('hint').textContent='';$('ingredients').innerHTML='';let b=document.createElement('button');b.className='action';b.textContent=stage===4?'厨房を出る':'次のお客様へ';b.onclick=()=>{stage++;next()};$('ingredients').appendChild(b)}function finish(){$('game').classList.add('hidden');$('scene').className='scene terror haunt';$('plate').textContent='🪑';$('shift').textContent='営業終了';$('time').textContent='--:--';$('sanity').textContent='店内：あなた一人';talk('店主のメモ','本日のご来店人数：0名。調理した料理：5皿。');$('ending').classList.remove('hidden');$('ending').innerHTML='「ありがとうございました」<br><span class="red">声は、あなたの口から聞こえた。</span><br><small>END — 6番目の従業員</small>';$('start').textContent='もう一度開店する';$('start').classList.remove('hidden')} $('start').onclick=begin;$('cook').onclick=cook;
</script></body></html>
